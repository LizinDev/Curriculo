name: i18n

on:
  push:
  pull_request:

jobs:
  verificar:
    name: Português e inglês em sincronia
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Só biblioteca padrão: o python3 do runner basta, sem instalar nada.
      - run: python3 tools/verificar-i18n.py
      - run: python3 tools/verificar-competencias.py
  pdf:
    name: PDFs acompanham o site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - run: python3 tools/verificar-pdf.py
      # Estraga cópias e espera que cada verificador acuse.
      - run: python3 tools/testar-verificadores.py
