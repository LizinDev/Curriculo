<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<title>og-image — gabarito 1200×630</title>

<!--
  Gabarito do cartão social (og-image.png), 1200×630. Só gera a imagem.

  Como regerar (na raiz do repositório):
    python3 -m http.server 8000
    chromium --headless=new --hide-scrollbars --window-size=1200,630 \
      --virtual-time-budget=4000 --screenshot=og-image.png http://localhost:8000/og-template.html

  O arquivo precisa continuar 1200×630: as metatags og:image:width e
  og:image:height do index.html declaram isso.
-->

<link rel="stylesheet" href="tokens.css">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { position: relative; width: 1200px; height: 630px; overflow: hidden; display: grid; grid-template-columns: 540px 20px 640px; font-family: var(--f-body); }
  .e { background: var(--in); color: var(--in-ink); }
  .c { background: var(--pipe); }
  .s { background: var(--out); color: var(--out-ink); }
  .d { font-family: var(--f-display); font-weight: 800; font-stretch: 60%; line-height: 1; white-space: nowrap; position: absolute; margin: 0; }
  .n { left: 52px; top: 48px; font-size: 50px; font-stretch: 72%; line-height: 1.02; white-space: pre; }
  .r { left: 52px; top: 166px; position: absolute; margin: 0; font-size: 22px; font-weight: 600; }
  .p { right: 692px; top: 262px; font-size: 204px; letter-spacing: -0.012em; }
  .k { left: 592px; top: 262px; font-size: 204px; letter-spacing: -0.012em; }
  .t { left: 592px; top: 486px; font-size: 82px; }
</style>
</head>
<body>
<div class="e"></div><div class="c"></div><div class="s"></div>
<p class="d n" style="color:var(--in-ink)">Pedro Henrique
Braz Moreira</p>
<p class="r" style="color:var(--in-ink-2)">Controller Jurídico</p>
<p class="d p" style="color:var(--in-ink)">prazos</p>
<p class="d k" style="color:var(--out-ink)">código</p>
<p class="d t" style="color:var(--out-ink)">&gt; rotina sob controle</p>
</body>
</html>
